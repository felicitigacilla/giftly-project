<ion-content class="giftly-shell ion-padding">
  <div class="top-bar">
    <div class="brand-wrap">
      <span class="giftly-logo">GIFTLY</span>
    </div>
    <div class="top-actions">
      <ion-button class="login-pill" fill="clear" size="small" routerLink="/login">Login</ion-button>
      <ion-button fill="clear" class="icon-button" routerLink="/shop">
        <ion-icon name="search-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear" class="icon-button" routerLink="/cart">
        <ion-icon name="cart-outline"></ion-icon>
      </ion-button>
    </div>
  </div>

  <h1 class="title">Explore Gifts</h1>

  <div class="category-row">
    <button
      *ngFor="let category of categories"
      class="category-pill"
      [class.active]="selectedCategory === category"
      type="button"
      (click)="changeCategory(category)"
    >
      {{ category }}
    </button>
  </div>

  <div *ngIf="loading" class="loading-state">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div *ngIf="!loading && products.length === 0" class="empty-state">
    <ion-icon name="basket-outline" size="large"></ion-icon>
    <p>No products available right now.</p>
  </div>

  <div class="product-grid" *ngIf="!loading && products.length > 0">
    <ion-card *ngFor="let product of products" button="true" [routerLink]="['/product', product.id]">
      <div class="product-image-wrap">
        <img *ngIf="product.image" [src]="product.image" [alt]="product.name" />
        <div *ngIf="!product.image" class="product-pattern">Giftly</div>
      </div>
      <ion-card-content>
        <h4>{{ product.name }}</h4>
        <div class="meta-row">
          <span>PHP {{ product.price || 0 }}</span>
          <ion-button fill="clear" class="mini-cart" (click)="$event.stopPropagation(); addToCart(product)">
            <ion-icon name="cart-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" (click)="router.navigateByUrl('/home')">
      <ion-icon name="home-outline"></ion-icon>
      <span>Home</span>
    </button>
    <button class="nav-item" (click)="router.navigateByUrl('/shop')">
      <ion-icon name="bag-outline"></ion-icon>
      <span>Shop</span>
    </button>
    <button class="nav-item add-button" (click)="router.navigateByUrl('/orders')">
      <ion-icon name="add-outline"></ion-icon>
    </button>
    <button class="nav-item" (click)="router.navigateByUrl('/orders')">
      <ion-icon name="cube-outline"></ion-icon>
      <span>Orders</span>
    </button>
    <button class="nav-item" (click)="router.navigateByUrl('/profile')">
      <ion-icon name="person-outline"></ion-icon>
      <span>Profile</span>
    </button>
  </div>
</ion-content>
